name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  rack:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: lin-x64
          - os: macos-latest
            platform: mac-arm64
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: make zip mingw-w64-x86_64-gcc jq
      - name: Rack SDK
        run: |
          curl -sSL -o sdk.zip https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip
          unzip -q sdk.zip
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: make -j4 dist RACK_DIR=$PWD/Rack-SDK
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j4 dist RACK_DIR=$PWD/Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: SemiFamily-${{ matrix.platform }}
          path: dist/*.vcvplugin

  metamodule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain + SDK
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          curl -sSL https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v12.3.1-1.2/xpack-arm-none-eabi-gcc-12.3.1-1.2-linux-x64.tar.gz | tar xz
          echo "$PWD/xpack-arm-none-eabi-gcc-12.3.1-1.2/bin" >> $GITHUB_PATH
          git clone --depth 1 --recursive --shallow-submodules https://github.com/4ms/metamodule-plugin-sdk
      - name: Build
        run: |
          cmake -S metamodule -B build/mm -G Ninja -DMETAMODULE_SDK_DIR=$PWD/metamodule-plugin-sdk
          cmake --build build/mm
      # MetaModule release naming (SDK docs/release.md): <BrandSlug>-v<plugin-version>.mmplugin
      - name: Name the plugin file
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          mv dist/metamodule/SemiFamily.mmplugin "dist/metamodule/SemiFamily-v$v.mmplugin"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "tag ${GITHUB_REF#refs/tags/} does not match plugin.json version $v"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SemiFamily-metamodule
          path: dist/metamodule/*.mmplugin

  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -Iengines tests/turnaround_engine.cpp engines/turnaround/Engine.cpp -o build/t && build/t
          g++ -std=c++17 -O2 -Iengines/epoch tests/epoch_engine.cpp engines/epoch/*.cpp -o build/e && build/e

  # A pushed tag vX.Y.Z publishes one GitHub Release (not a pre-release: the MetaModule plugin
  # site ignores those) with the .mmplugin and the three .vcvplugin files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rack, metamodule]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SEMI Family ${{ github.ref_name }}
          body_path: release/NOTES.md
          prerelease: false
          files: |
            artifacts/*.mmplugin
            artifacts/*.vcvplugin
